name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @mitchlui/website exec playwright install --with-deps chromium

      - name: Check for unused files, exports and dependencies
        run: pnpm knip

      - name: Lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build build-storybook

      - name: Deploy to NameCheap
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "apps/website/build/client/"
          target: "public_html"
          strip_components: 4
          overwrite: true




